name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix Package Version & Generate Android
        run: |
          sed -i 's/flutter_overlay_window:.*/flutter_overlay_window: any/g' pubspec.yaml
          rm -rf android
          flutter create . --platforms=android --project-name nish_trader

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TR-BOT-App
          path: build/app/outputs/flutter-apk/app-release.apk
